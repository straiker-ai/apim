# Run an Azure APIM self-hosted gateway locally, bound to a real APIM instance
# in Azure. The gateway pulls policy + named values from APIM and runs them
# against requests hitting localhost:5000 — same flow as production, but the
# round-trip from edit to test is seconds instead of minutes.
#
# Prereqs:
#   1. An APIM instance in Azure (free Developer tier works)
#   2. Inside that APIM, create a Self-hosted Gateway entity:
#        Portal → APIM → Gateways → + Add gateway
#      Copy the configuration token from the deploy instructions.
#   3. cp .env.example .env  and fill in the values.
#
# Run: docker-compose up
# Test against http://localhost:5000/<api-path>/v1/chat/completions

services:
  gateway:
    image: mcr.microsoft.com/azure-api-management/gateway:latest
    container_name: apim-straiker-gateway
    ports:
      - "5000:8080"   # HTTP proxy
      - "5443:8081"   # HTTPS proxy (cert auto-generated by gateway)
    environment:
      config.service.endpoint: ${APIM_CONFIG_ENDPOINT}
      config.service.auth: ${APIM_CONFIG_AUTH}
      net.server.http.forwarded.proto.enabled: "true"
      logs.std: text
      logs.std.color: "true"
      logs.std.level: information
    restart: unless-stopped
